# Exemplo de configuração local. Gere a sua com: ./scripts/setup-agent-token.sh
# (cria portal/app-config.local.yaml, que NÃO é versionado)
backend:
  auth:
    externalAccess:
      - type: static
        options:
          token: <token-gerado>
          subject: platform-agent
        accessRestrictions:
          - plugin: mcp-actions
          - plugin: catalog
          - plugin: scaffolder
          - plugin: agent
