# Produção (vai dentro da imagem). Sem nenhum segredo nem valor de ambiente:
# - segredos: variáveis do Secret "<release>-env" e arquivos do Secret "<release>-files"
#   montados em /etc/backstage/secrets (veja deploy/README.md);
# - URLs e opções do ambiente: variáveis do values.yaml do chart (deploy/helm) e o
#   bloco appConfig, montado como um config extra.
#
# Ordem de leitura: app-config.yaml -> app-config.production.yaml -> app-config.deploy.yaml (Helm).

app:
  baseUrl: ${APP_BASE_URL}
  signIn:
    providers: [oidc]

organization:
  platformTeam: ${PLATFORM_TEAM}

backend:
  baseUrl: ${APP_BASE_URL}
  listen: ':7007'
  cors:
    origin: ${APP_BASE_URL}
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # TLS: defina PGSSLMODE=require (ou verify-full + NODE_EXTRA_CA_CERTS) no values.yaml.

auth:
  environment: production
  # Estado do login OIDC (nonce, PKCE) numa sessão assinada.
  session:
    secret: ${BACKSTAGE_AUTH_SESSION_SECRET}
  providers:
    # O guest é recusado em produção pelo próprio Backstage; fica sem config aqui.
    oidc:
      production:
        metadataUrl: ${OIDC_METADATA_URL}
        clientId: ${OIDC_CLIENT_ID}
        clientSecret: ${OIDC_CLIENT_SECRET}
        prompt: auto
        signIn:
          resolvers:
            - resolver: emailMatchingUserEntityProfileEmail

integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_APP_CLIENT_ID}
          clientSecret: ${GITHUB_APP_CLIENT_SECRET}
          privateKey:
            $file: /etc/backstage/secrets/github-app-private-key.pem
          allowedInstallationOwners: ['${GITHUB_ORG}']

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Template]
  # Só o que é da plataforma; serviços vêm do GitHub e pessoas/times do diretório.
  locations:
    - type: file
      target: ./catalog/platform/all.yaml
    - type: file
      target: ./templates/all.yaml
  providers:
    keycloakOrg:
      default:
        baseUrl: ${KEYCLOAK_BASE_URL}
        loginRealm: ${KEYCLOAK_REALM}
        realm: ${KEYCLOAK_REALM}
        clientId: ${KEYCLOAK_CATALOG_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CATALOG_CLIENT_SECRET}
        schedule:
          frequency: { minutes: 15 }
          timeout: { minutes: 5 }
          initialDelay: { seconds: 30 }
    github:
      empresa:
        organization: ${GITHUB_ORG}
        catalogPath: /catalog-info.yaml
        filters:
          allowForks: false
          allowArchived: false
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 10 }
          initialDelay: { seconds: 60 }

techdocs:
  builder: local
  generator:
    # Sem Docker dentro do cluster: o mkdocs vai na imagem.
    runIn: local
  publisher:
    # Local = disco do pod (some ao reiniciar; com mais de 1 réplica, use awsS3/googleGcs/azureBlobStorage).
    type: local

agent:
  gateway:
    type: litellm
    baseUrl: ${LITELLM_BASE_URL}
    apiKey: ${LITELLM_PORTAL_KEY}
    route: messages
    model: ${LITELLM_MODEL}
    tags: [app:backstage-agent]
    # Keys de cada time (orçamento definido pelos admins do LiteLLM). Arquivo YAML
    # "time: key" no Secret de arquivos; use {} se ainda não houver keys de time.
    teamKeys:
      $include: /etc/backstage/secrets/litellm-team-keys.yaml
  governance:
    # Em produção, só com aval da política de dados da empresa.
    storePrompts: false
    budgets:
      enabled: true
