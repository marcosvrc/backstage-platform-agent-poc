# LiteLLM Proxy da POC (gateway de IA).
# O Platform Agent usa a rota de pass-through /anthropic, que repassa a Messages API
# nativa sem tradução. O model_list abaixo serve para as rotas unificadas e o mapa de custos.
model_list:
  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
