services:
  postgres:
    image: postgres:17
    container_name: backstage-poc-postgres
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage # apenas para desenvolvimento local
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U backstage']
      interval: 5s
      retries: 10

  # Gateway de IA (opcional). Suba com: ./scripts/setup-gateway.sh
  litellm:
    image: ghcr.io/berriai/litellm:v1.90.2
    container_name: backstage-poc-litellm
    profiles: [gateway]
    command: ['--config', '/app/config.yaml', '--port', '4000']
    env_file:
      - path: gateway/.env # gerado pelo setup-gateway.sh (não versionado)
        required: false
    environment:
      DATABASE_URL: postgresql://backstage:backstage@postgres:5432/litellm
    ports:
      - '4000:4000'
    volumes:
      - ./gateway/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Identidade (SSO e diretório de usuários/grupos). Suba com: ./scripts/setup-keycloak.sh
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: backstage-poc-keycloak
    profiles: [keycloak]
    command: ['start-dev', '--import-realm', '--http-port', '8180']
    env_file:
      - path: keycloak/.env # gerado pelo setup-keycloak.sh (não versionado)
        required: false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: backstage
      KC_DB_PASSWORD: backstage # apenas para desenvolvimento local
      KC_HEALTH_ENABLED: 'true'
      # Mesmo emissor para o navegador e para o backend (os dois rodam no host).
      KC_HOSTNAME: http://localhost:8180
    ports:
      - '8180:8180'
    volumes:
      - ./keycloak/realm-acme.json:/opt/keycloak/data/import/realm-acme.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
