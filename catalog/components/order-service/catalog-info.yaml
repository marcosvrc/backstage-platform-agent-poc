apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: order-service
  title: Order Service
  description: Orquestra a criação de pedidos, reserva estoque e solicita pagamento
  tags: [java, spring-boot]
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://grafana.acme.example/d/order-service
      title: Dashboard
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: group:checkout-team
  system: checkout
  providesApis: [order-api, order-events]
  consumesApis: [payment-api]
  dependsOn:
    - component:inventory-service
    - resource:orders-db
    - resource:orders-topic
