# Ponto de entrada do catálogo fictício da POC.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: acme-catalog
  description: Catálogo fictício da Acme usado na POC do Platform Agent
spec:
  targets:
    - ./systems/systems.yaml
    - ./apis/apis.yaml
    - ./resources/resources.yaml
    - ./platform/all.yaml
