    - ./components/order-service/catalog-info.yaml
    - ./components/payment-service/catalog-info.yaml
    - ./components/inventory-service/catalog-info.yaml
    - ./components/notification-worker/catalog-info.yaml
    - ./components/platform-handbook/catalog-info.yaml
